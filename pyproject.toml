[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metatr-signal"
version = "0.1.0"
description = "Read-only, testable MT5 signal research starter"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
]

[project.optional-dependencies]
mt5 = ["MetaTrader5>=5.0.45; sys_platform == 'win32'"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
metatr = "metatr.cli:main"
metatr-bridge = "metatr.bridge:main"
metatr-futures = "metatr.futures_cli:main"
metatr-registry = "metatr.registry_cli:main"
metatr-paper = "metatr.paper_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
